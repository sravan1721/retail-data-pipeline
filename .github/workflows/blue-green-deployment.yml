name: Blue Green Deployment Demo
on:
  workflow_dispatch:
jobs:
  deploy-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Current Production Deployment
        run : echo "Blue Version 1.0 is currently in the Production Environment"
      - name: Deploy New Version
        run : echo "Green Version 2.0 is deployed to the Production Environment"
      - name: Health Check
        run : echo "Green deployment is healthy and running successfully"
  switch-traffic:
    needs: deploy-green
    runs-on: ubuntu-latest
    steps:
      - name: Switch Traffic to Green Deployment
        run : echo "Traffic is now switched to Green Version 2.0 in the Production Environment"
      - name: Verify Traffic Switch
        run : echo "Traffic switch to Green deployment is verified and successful"
      - name: Deployment completed
        run : echo "Blue-Green Deployment completed successfully! Green Version 2.0 is now live in the Production Environment"