name: retail Data Engineering CI
on:
 push:
   branches:
     - devlop
 pull_request:
   branches:
     - devlop
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name : Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTest
        run: python -m pip install pytest
      - name: Execute Test cases
        run: python -m pytest -v
      - name: Execute Python Script
        run: python cust_ingestion_1.py
      - name: Pipeline completed
        run: echo "DONE SUCCESFULLY"
  deploy_dev:
    needs: validate
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Deploy to DEV
        run : echo "Deploying to development"
  deploy_qa:
    needs: validate
    runs-on: ubuntu-latest
    environment: QA

    steps:
      - name: Deploy to QA
        run : echo "Deploying to QA"

  deploy_prod:
    needs: validate
    runs-on: ubuntu-latest
    environment: PROD

    steps:
       - name: Deploy to PROD
         run : echo "Deploying to Production"
      
         
       
