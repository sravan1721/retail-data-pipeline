name: Github Secrets Demo
on:
  workflow_dispatch:
jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Accessing Dtaabase Credentials
        env:
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}
        run:  |
          if [ -n "$DB_USER" ] && [ -n "$DB_PASS" ]; then
            echo "Database credentials lOADED SUCCESSFULLY."
            echo "Username: $DB_USER"
            echo "Password: $DB_PASS"
          else
            echo "Database credentials are not set."
            exit 1
          fi
      - name: Complete Secrets Demo
        run: echo "Secrets Demo Completed Successfully"